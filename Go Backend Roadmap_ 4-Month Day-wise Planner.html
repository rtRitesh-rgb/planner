<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go Backend Roadmap: 4-Month Day-wise Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6edf1;--glass:rgba(255,255,255,.66);--solid:#fff;--ink:#16212c;--mu:#6c7b8a;--line:#d6e0e7;--soft:#eef3f6;--navy:#1b2733;--teal:#1f9d8f;--tealbg:#d9efec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.6 'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:20px}
.side{background:var(--navy);border-radius:26px;padding:22px 14px;position:sticky;top:20px;align-self:start;color:#c9d4de}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;color:#fff;font-weight:600}
.brand b{width:36px;height:36px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:13px}
.brand small{display:block;font-weight:400;color:#8fa1b1;font-size:11px;line-height:1.2}
.nv{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-radius:14px;padding:10px 12px;margin-bottom:4px;cursor:pointer;color:inherit;text-align:left}
.nv i{font-style:normal;font-size:12px;opacity:.7}
.nv:hover{background:rgba(255,255,255,.07)}
.nv.on{background:#fff;color:var(--navy);font-weight:500}
.cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7f91a2;padding:14px 12px 6px}
.main{min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:20px;font-weight:600;margin:0 auto 0 0}
.pill{background:var(--glass);border:1px solid #fff;border-radius:999px;padding:8px 16px;outline:0;backdrop-filter:blur(12px)}
.pill:focus{border-color:var(--teal)}
#q{width:240px}
.lbl{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid #fff;border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(33,56,76,.07)}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600}
.hero{display:flex;align-items:center;gap:16px}
.hero svg{flex:none}
.hero b{display:block;font-size:17px;font-weight:600}
.hero span{color:var(--mu);font-size:12.5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--solid);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.tile b{display:block;font-size:20px;font-weight:600}
.tile span{font-size:12px;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cd{aspect-ratio:1;border:0;border-radius:12px;background:var(--solid);cursor:pointer;font-size:13px;position:relative}
.cd:hover{background:var(--soft)}
.cd.p::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--teal)}
.cd.d{background:var(--tealbg);color:#0f6b61;font-weight:500}
.cd.t{box-shadow:inset 0 0 0 1.5px var(--teal)}
.cd.s{background:var(--navy);color:#fff}
.timer{text-align:center}
.tm{font-size:42px;font-weight:500;letter-spacing:.02em;margin:4px 0}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;margin-bottom:6px}
.seg button{border:0;background:none;padding:5px 16px;border-radius:999px;cursor:pointer;font-size:12.5px}
.seg button.on{background:#fff;font-weight:500}
.btn{border:1px solid var(--line);background:var(--solid);border-radius:12px;padding:8px 16px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#2a3a4a}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.dh h2{margin:2px 0 0;font-size:20px;font-weight:600}
.tag{display:inline-block;font-size:11.5px;background:var(--soft);border-radius:999px;padding:2px 12px;color:var(--mu)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.bar div{height:100%;background:var(--teal);width:0;transition:width .25s}
.sec{margin:18px 0 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:500}
.it{display:flex;gap:12px;align-items:flex-start;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.it:hover{border-color:#b9c9d4}
.it input{appearance:none;width:18px;height:18px;margin:3px 0 0;border:1.5px solid #aab9c5;border-radius:6px;flex:none;cursor:pointer;display:grid;place-items:center;background:#fff}
.it input:checked{background:var(--teal);border-color:var(--teal)}
.it input:checked::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it.x span{color:var(--mu);text-decoration:line-through}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--solid);resize:vertical;outline:0}
textarea:focus{border-color:var(--teal)}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips button{border:0;background:var(--soft);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:12.5px}
.chips button.on{background:var(--navy);color:#fff}
.dr{display:grid;grid-template-columns:34px 1fr 90px 44px;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer}
.dr:hover{background:rgba(255,255,255,.7)}
.dr.s{background:#fff;box-shadow:0 0 0 1px var(--line)}
.dr .n{width:34px;height:34px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-weight:500;font-size:13px}
.dr.dn .n{background:var(--teal);color:#fff}
.dr small{color:var(--mu);display:block;font-size:11.5px;line-height:1.3}
.dr em{font-style:normal;font-size:12px;color:var(--mu);text-align:right}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--tealbg);color:#0f5b52;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:24px}
@media(max-width:980px){.app{grid-template-columns:1fr;padding:12px}.side{position:static;padding:14px;border-radius:20px}.side .cap{display:none}.sn{display:flex;gap:6px;overflow-x:auto}.nv{width:auto;white-space:nowrap;gap:10px;margin:0}.brand{padding-bottom:12px}.grid{grid-template-columns:1fr}#q{width:100%}.top h1{width:100%}}
@media(max-width:520px){.dr{grid-template-columns:34px 1fr 44px}.dr .bw{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><b>28</b><div>Go Backend Planner<small>4-month roadmap</small></div></div>
<div class="cap">Plan</div>
<div class="sn" id="nav"></div>
<div class="cap">Project and career</div>
<div class="sn" id="tools"></div>
</aside>
<main class="main">
<div class="top">
<h1 id="ttl">Overview</h1>
<input class="pill" id="q" type="search" placeholder="Search topics (press /)">
<label class="lbl">Start date <input class="pill" type="date" id="sd" style="padding:6px 12px"></label>
</div>
<div class="grid">
<div class="col">
<div class="card hero" id="hero"></div>
<div class="tiles" id="tiles"></div>
<div class="card"><h3>28-day calendar</h3><div class="cal" id="cal"></div></div>
<div class="card timer"><h3>Focus timer</h3>
<div class="seg"><button id="mf" class="on" onclick="md('f')">Focus 25</button><button id="mb" onclick="md('b')">Break 5</button></div>
<div class="tm" id="tt">25:00</div>
<div class="row" style="justify-content:center"><button class="btn pri" id="ts" onclick="tgl()">Start</button><button class="btn" onclick="rs()">Reset</button></div>
<div class="lbl" id="sess" style="margin-top:10px"></div></div>
</div>
<div class="col">
<div class="card" id="detail"></div>
<div class="card" id="lc"><h3>All days</h3>
<div class="chips" id="chips"><button data-f="all" class="on">All</button><button data-f="pending">Pending</button><button data-f="done">Done</button></div>
<div id="list"></div></div>
</div>
</div>
<div class="row" style="justify-content:center;margin:22px 0 8px"><button class="btn" id="rst">Reset progress</button></div>
</main>
</div>

let chk=ST.get('go4_chk',{}),notes=ST.get('go4_notes',{}),start=ST.get('go4_start',''),sess=ST.get('go4_sess',{}),wk='all',flt='all',sel=0;
let id=0;const days=[];
W.forEach((w,wi)=>w.d.forEach(d=>{d.id=++id;d.w=wi;d.items=[...d.l.map(x=>({k:'Learn',x})),...d.p.map(x=>({k:'Practice',x})),{k:'Build',x:d.b}];days.push(d)}));
const lcc=d=>d.g=='Build'?1:0;

function render(){
 const dd=days.filter(done).length,tot=days.reduce((a,d)=>a+d.items.length,0),dn=days.reduce((a,d)=>a+dc(d),0),p=Math.round(dn/tot*100);

 const d=days[sel-1],dt=dateOf(d.id),pc=dc(d)/d.items.length*100;let h=`<div class="dh"><div><span class="tag">Day ${d.id} · Month ${d.w+1} · ${d.g}</span><h2>${esc(d.t)}</h2><div class="lbl">${dt?fmt(dt)+' · ':''}${dc(d)} of ${d.items.length} tasks done</div></div><div class="row"><button class="btn" onclick="pk(${d.id-1})" ${d.id==1?'disabled':''}>Previous</button><button class="btn" onclick="pk(${d.id+1})" ${d.id==days.length?'disabled':''}>Next</button></div></div><div class="bar"><div style="width:${pc}%"></div></div>`;
 let last='';d.items.forEach((it,i)=>{if(it.k!=last){h+=`<div class="sec">${it.k=='Learn'?'Learn':it.k=='Practice'?'Practice':'Deliverable'}</div>`;last=it.k}h+=`<label class="it ${chk[d.id+'-'+i]?'x':''}"><input type="checkbox" ${chk[d.id+'-'+i]?'checked':''} onchange="tk(${d.id},${i},this.checked)"><span>${esc(it.x)}</span></label>`});
 h+=`<div class="sec">Notes</div><textarea placeholder="What did you learn? What was unclear?" oninput="sn(${d.id},this.value)">${esc(notes[d.id]||'')}</textarea><div class="row" style="margin-top:12px"><button class="btn pri" onclick="all(${d.id},${!done(d)})">${done(d)?'Mark day as pending':'Mark day complete'}</button></div><div class="note">${esc(W[d.w].c)}</div>`;

 $('#list').innerHTML=ls.length?ls.map(x=>`<div class="dr ${x.id==sel?'s':''} ${done(x)?'dn':''}" onclick="pk(${x.id},1)"><div class="n">${x.id}</div><div>${esc(x.t)}<small>${x.g}${dateOf(x.id)?' · '+fmt(dateOf(x.id)):''}</small></div><div class="bw bar"><div style="width:${dc(x)/x.items.length*100}%"></div></div><em>${dc(x)}/${x.items.length}</em></div>`).join(''):'<div class="empty">No days match.</div>';
